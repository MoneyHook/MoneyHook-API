services:
  # sql:
  #   image: mysql:8.0.32
  #   restart: always
  #   container_name: "sql"
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "password"
  #     MYSQL_DATABASE: "moneyhook"
  #     MYSQL_USER: "moneyhook"
  #     MYSQL_PASSWORD: "password"
  #   volumes:
  #     - ./sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
  #     - ./sql/mysql.cnf:/etc/mysql/conf.d/my.cnf
  #     - ./sql/settings:/var/lib/mysql
  psql:
    image: postgres:17
    restart: always
    container_name: "psql"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "moneyhook"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "moneyhook"
    volumes:
      - ./psql/init/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./psql/data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: "pgadmin"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    volumes:
      - ./psql/pgadmin_data/servers.json:/pgadmin4/servers.json
    depends_on:
      - psql
  firebase:
    container_name: firebase
    build:
      context: ./firebase
    ports:
      - "4000:4000"
      - "9099:9099"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9099').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  go:
    container_name: app
    volumes:
      - ./:/workspace/
    tty: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 8080:8080
    depends_on:
      firebase:
        condition: service_healthy
    environment:
      DATABASE_TYPE: "PostgreSQL" # "MySQL" or "PostgreSQL"
      JOB_NAME: "money-hooks-batch-schedule"
      # MySQL
      MYSQL_HOST: "sql:3306"
      MYSQL_DATABASE: "moneyhook"
      MYSQL_USER: "moneyhook"
      MYSQL_PASSWORD: "password"
      NET: "tcp" # "unix" or "tcp"
      # PostgreSQL
      POSTGRES_HOST: "psql"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "moneyhook"
      POSTGRES_USER: "moneyhook"
      POSTGRES_PASSWORD: "password"
      SSLMODE: "disable" # "disable" or "verify-full"
      # Firebase
      GOOGLE_CLOUD_PROJECT: "demo-moneyhooks"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase:9099"
      ENABLE_SEED_DATA: "true"
      ENABLE_DEVELOPMENT_USER: "true"
    command: ["sh", "-c", "cd /workspace/app && go run ."]
